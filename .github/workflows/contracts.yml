name: Linux runtime contracts
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.85.1
jobs:
  contracts:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    defaults:
      run:
        working-directory: outputs/agent-shell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Linux test identity and toolchain
        run: |
          sudo useradd --system --user-group --shell /usr/sbin/nologin agentos-ai
          rustup toolchain install 1.85.1 --profile minimal
      - name: Python and Rust contracts
        run: |
          python3 -m unittest discover -s tests -p '*_test.py'
          python3 -m unittest discover -s ../vm-foundation/tests -p '*_test.py'
          cargo +1.85.1 test --locked
          cargo +1.85.1 build --release --locked
          python3 tests/release_catalog.py
      - name: Authenticated presentation and callback IPC
        run: |
          python3 tests/presentation_guest.py
          python3 tests/broker_sources_guest.py

  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libvte-2.91-gtk4-dev weston dbus-x11 fonts-inter fonts-noto-cjk at-spi2-core python3-pyatspi
          rustup toolchain install 1.85.1 --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            outputs/native-shell/target
          key: desktop-arm64-rust185-${{ hashFiles('outputs/native-shell/Cargo.lock') }}
      - name: Build native desktop
        run: |
          cargo +1.85.1 test --locked --manifest-path outputs/native-shell/Cargo.toml
          cargo +1.85.1 build --locked --manifest-path outputs/native-shell/Cargo.toml
          cargo +1.85.1 build --release --locked --manifest-path outputs/agent-shell/Cargo.toml
      - name: Native transport with real broker and PTY screen keeper
        run: |
          sudo apt-get install -y --no-install-recommends tmux
          python3 outputs/native-shell/tests/pty_broker.py
      - name: Real native rendering and interaction
        run: |
          for appearance in light dark; do
            for scale in 1 2; do
              dbus-run-session -- python3 outputs/native-shell/tests/native_desktop.py --appearance "$appearance" --text-scale "$scale"
            done
          done
          dbus-run-session -- python3 outputs/native-shell/tests/native_desktop.py --load
          dbus-run-session -- python3 outputs/native-shell/tests/native_desktop.py --small --text-scale 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-desktop-arm64
          path: outputs/native-shell/test-output/

  compositor:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Wayland dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwayland-dev libxkbcommon-dev libudev-dev libinput-dev libgbm-dev libegl1-mesa-dev libgles2-mesa-dev libseat-dev weston dbus-x11 libgtk-4-dev libvte-2.91-gtk4-dev fonts-inter fonts-noto-cjk at-spi2-core python3-pyatspi mesa-utils tmux
          rustup toolchain install 1.85.1 --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            outputs/native-compositor/target
            outputs/native-shell/target
            outputs/agent-shell/target
          key: compositor-arm64-rust185-${{ hashFiles('outputs/native-compositor/Cargo.lock') }}
      - name: Build and policy tests
        run: |
          cargo +1.85.1 test --locked --manifest-path outputs/native-compositor/Cargo.toml
          cargo +1.85.1 build --locked --manifest-path outputs/native-compositor/Cargo.toml
      - name: Direct backend startup failure and cleanup
        run: python3 outputs/native-shell/tests/direct_backend.py
      - name: Native and conventional clients in agentOS compositor
        run: |
          cargo +1.85.1 build --locked --manifest-path outputs/native-shell/Cargo.toml
          cargo +1.85.1 build --locked --manifest-path outputs/native-shell/Cargo.toml --example minimum_client
          cargo +1.85.1 build --release --locked --manifest-path outputs/agent-shell/Cargo.toml
          dbus-run-session -- python3 outputs/native-shell/tests/native_desktop.py --compositor
          dbus-run-session -- python3 outputs/native-shell/tests/native_desktop.py --compositor --shared
      - name: Full graphical login lifecycle and staged release
        run: |
          dbus-run-session -- python3 outputs/native-shell/tests/native_session.py
          dbus-run-session -- python3 outputs/native-shell/tests/native_session.py --host-failure
          dbus-run-session -- python3 outputs/native-shell/tests/native_session.py --compositor-failure
          python3 outputs/agent-shell/tests/graphical_release.py
          python3 outputs/agent-shell/tests/deployed_graphics.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: compositor-arm64
          path: outputs/native-shell/test-output/
