name: Linux runtime contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    defaults:
      run:
        working-directory: outputs/agent-shell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Linux test identity and toolchain
        run: |
          sudo useradd --system --user-group --shell /usr/sbin/nologin agentos-ai
          rustup toolchain install 1.85.1 --profile minimal
      - name: Python and Rust contracts
        run: |
          python3 -m unittest discover -s tests -p '*_test.py'
          cargo +1.85.1 test --locked
          cargo +1.85.1 build --release --locked
      - name: Authenticated presentation and callback IPC
        run: python3 tests/presentation_guest.py

  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev weston dbus-x11 fonts-inter fonts-noto-cjk at-spi2-core
          rustup toolchain install 1.85.1 --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            outputs/native-shell/target
          key: desktop-arm64-rust185-${{ hashFiles('outputs/native-shell/Cargo.lock') }}
      - name: Build native desktop
        run: cargo +1.85.1 build --locked --manifest-path outputs/native-shell/Cargo.toml
